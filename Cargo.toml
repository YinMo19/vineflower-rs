[package]
name = "vineflower-rs"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "Native Rust JVM decompiler based on Vineflower"
autotests = false

[lib]
test = false
doctest = false

[[test]]
name = "upstream_parity"
path = "test/upstream_parity.rs"

[[test]]
name = "control_flow"
path = "test/control_flow.rs"

[[test]]
name = "structured_flow"
path = "test/structured_flow.rs"

[[test]]
name = "class_nodes"
path = "test/class_nodes.rs"

[[test]]
name = "driver"
path = "test/driver.rs"

[[test]]
name = "kotlin_body"
path = "test/kotlin_body.rs"

[[test]]
name = "jhash"
path = "test/jhash.rs"

[dependencies]
arcstr = "1.2.0"
bit-set = "0.11.1"
bitflags = "2"
clap = { version = "4.6", features = ["derive", "string"] }
# 4.6.1 through 4.6.12 break Bash subcommand completion for hyphenated binary names.
clap_complete = "=4.6.0"
clap_lex = "1.1"
fancy-regex = "0.16"
flate2 = "1"
index_vec = "0.1.4"
indexmap = "2"
itertools = "0.15.0"
jimage-rs = { version = "0.0.5", path = "vendor/jimage-rs" }
la-arena = "0.3.1"
log = "0.4.35"
num-bigint = "0.4"
num-integer = "0.1"
prost = "0.14"
rawzip = "0.5.3"
rayon = "1.12"
rustc-hash = "2"
smallvec = { version = "1", features = ["union"] }
tempfile = "3"
thiserror = "2"
unicode-general-category = "1"

[dev-dependencies]
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
