[package]
name = "vineflower-rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Rust JVM decompiler based on Vineflower"
autotests = false

[lib]
test = false
doctest = false

[[test]]
name = "upstream_parity"
path = "test/upstream_parity.rs"

[[test]]
name = "control_flow"
path = "test/control_flow.rs"

[[test]]
name = "structured_flow"
path = "test/structured_flow.rs"

[dependencies]
arcstr = "1.2.0"
bit-set = "0.11.1"
clap = { version = "4.6", features = ["derive"] }
index_vec = "0.1.4"
indexmap = "2"
itertools = "0.15.0"
jimage-rs = "0.0.5"
la-arena = "0.3.1"
log = "0.4.35"
num-integer = "0.1"
prost = "0.14"
rustc-hash = "2"
tempfile = "3"
thiserror = "2"
unicode-general-category = "1"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
