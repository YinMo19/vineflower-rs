[package]
name = "vineflower-rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Rust JVM decompiler based on Vineflower"

[dependencies]
cesu8 = "1.1"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"
thiserror = "2"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
